<!DOCTYPE html>
<html>
<head><style>
body { background: #111; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(3, 160px); gap: 10px; margin: 20px; }
.cell { border: 1px solid #444; text-align: center; background: #222; border-radius: 8px; padding: 5px; }
.cell img { width: 100%; height: auto; }
</style></head>
<body>
<h1>Yuji 3x3 Grid</h1>
<div class='grid'>
<div class='cell'><img src='yuji/top-left.webp'><p>top-left</p></div>
<div class='cell'><img src='yuji/top.webp'><p>top</p></div>
<div class='cell'><img src='yuji/top-right.webp'><p>top-right</p></div>
<div class='cell'><img src='yuji/left.webp'><p>left</p></div>
<div class='cell'><img src='yuji/center.webp'><p>center</p></div>
<div class='cell'><img src='yuji/right.webp'><p>right</p></div>
<div class='cell'><img src='yuji/bottom-left.webp'><p>bottom-left</p></div>
<div class='cell'><img src='yuji/bottom.webp'><p>bottom</p></div>
<div class='cell'><img src='yuji/bottom-right.webp'><p>bottom-right</p></div>
</div></body></html>
